<!-- register.component.html -->
<div class="form-container">
  <h2>Cadastrar</h2>
  <form>
    <div class="input-container">
      <input
        type="text"
        id="name"
        class="input"
        placeholder="exemplo@empresa.com"
        formControlName="name"
      />
      <label for="name">Nome</label>
    </div>

    <div class="input-container">
      <input
        type="text"
        id="email"
        class="input"
        placeholder="exemplo@empresa.com"
        formControlName="email"
      />
      <label for="email">E-mail</label>
    </div>
    <div class="input-container">
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        class="input"
        placeholder="********"
        formControlName="password"
      />
      <label for="password">Senha</label>
      <button
        type="button"
        class="input-action-btn"
        (click)="showPassword = !showPassword"
      >
        <i
          class="bi"
          [class.bi-eye]="!showPassword"
          [class.bi-eye-slash]="showPassword"
        ></i>
      </button>
    </div>
    <div class="input-container">
      <input
        [type]="showPasswordConfim ? 'text' : 'password'"
        id="password"
        class="input"
        placeholder="********"
        formControlName="password"
      />
      <label for="password">Confirme a senha</label>
      <button
        type="button"
        class="input-action-btn"
        (click)="showPasswordConfim = !showPasswordConfim"
      >
        <i
          class="bi"
          [class.bi-eye]="!showPasswordConfim"
          [class.bi-eye-slash]="showPasswordConfim"
        ></i>
      </button>
    </div>
    <button type="submit" class="btn btn-primary">Cadastrar</button>
  </form>
</div>
