<section id="contato" class="section contact-page">
  <div class="container">
    <div class="row g-5">
      <div class="col-lg-5">
        <h6 class="text-accent fw-bold text-uppercase text-primary">Contato</h6>
        <h2 class="display-5 fw-bold mb-4 color-text">Vamos impulsionar seu negócio?</h2>
        <p class="color-text mb-5">
          Nossa equipe comercial está pronta para desenhar uma proposta personalizada para sua rede de lojas ou indústria.
        </p>

        <div class="contact-info">
          <div class="d-flex align-items-center mb-4">
            <div class="icon-circle bg-primary text-white me-3">
              <i class="bi bi-geo-alt"></i>
            </div>
            <div>
              <h5 class="mb-0 color-text">Localização</h5>
              <p class="color-text mb-0">Av. Industrial, 1500 - São Paulo, SP</p>
            </div>
          </div>

          <div class="d-flex align-items-center mb-4">
            <div class="icon-circle bg-success text-white me-3">
              <i class="bi bi-whatsapp"></i>
            </div>
            <div>
              <h5 class="mb-0 color-text">WhatsApp Comercial</h5>
              <p class="color-text mb-0">(11) 99999-8888</p>
            </div>
          </div>

          <div class="d-flex align-items-center">
            <div class="icon-circle bg-info text-white me-3">
              <i class="bi bi-envelope-at"></i>
            </div>
            <div>
              <h5 class="mb-0 color-text">E-mail</h5>
              <p class="color-text mb-0">comercial@seub2b.com.br</p>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="contact-card shadow-lg p-4 p-md-5">
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold color-text">Seu Nome</label>
                <input type="text" class="form-control" placeholder="Ex: João Silva">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold color-text">CNPJ da Empresa</label>
                <input type="text" class="form-control color-text" placeholder="00.000.000/0000-00">
              </div>
              <div class="col-12">
                <label class="form-label fw-bold color-text">E-mail Corporativo</label>
                <input type="email" class="form-control color-text" placeholder="joao@empresa.com.br">
              </div>
              <div class="col-12">
                <label class="form-label fw-bold color-text">Como podemos ajudar?</label>
                <textarea class="form-control color-text" rows="4" placeholder="Descreva sua necessidade..."></textarea>
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold ">
                  Enviar Solicitação <i class="bi bi-send ms-2"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
